[project]
name = "aagentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "machinelearing", email = "olooyasir5@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.4",
    "langchain-google-genai>=4.4.2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "tavily-python>=0.8.5",
]

[project.scripts]
aagentic-ai = "aagentic_ai:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
